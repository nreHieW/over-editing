[project]
name = "deepcoder-minimal-edit"
description = "DeepCoder minimal-code-editing environment with execution and similarity rewards."
tags = ["code-editing", "rl", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "codebleu>=0.7.0",
    "datasets>=4.0.0",
    "prime>=0.3.26",
    "python-levenshtein>=0.27.1",
    "verifiers>=0.1.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "README.md",
    "deepcoder_minimal_edit.py",
    "deepcoder_utils/**/*.py",
    "partial_edits_utils/**/*.py",
]
